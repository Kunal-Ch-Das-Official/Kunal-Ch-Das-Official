<svg fill="none" viewBox="0 0 760 260" width="760" height="260" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
  <foreignObject width="100%" height="100%">
    <div xmlns="[http://www.w3.org/1999/xhtml](http://www.w3.org/1999/xhtml)">
      <style>
        .window {
          background-color: #0d1117;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 16px;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          box-sizing: border-box;
        }
        .controls {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 14px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .title { color: #8b949e; font-size: 12px; margin-left: 8px; font-weight: bold; }
        pre { margin: 0; font-size: 13px; line-height: 1.45; }
        
        /* Your custom theme colors */
        .kw-pink   { color: #ff79c6; font-weight: bold; } /* const */
        .var-cyan  { color: #8be9fd; }                    /* architect */
        .prop-green{ color: #50fa7b; }                    /* keys */
        .str-yellow{ color: #f1fa8c; }                    /* values */
        .punct     { color: #f8f8f2; }                    /* brackets & colons */
      </style>

      <div class="window">
        <div class="controls">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="title">kunal@subatomjs: ~</span>
        </div>
        <pre><code><span class="kw-pink">const</span> <span class="var-cyan">architect</span> <span class="punct">= {</span>
  <span class="prop-green">name</span><span class="punct">:</span> <span class="str-yellow">"Kunal Chandra Das"</span><span class="punct">,</span>
  <span class="prop-green">handle</span><span class="punct">:</span> <span class="str-yellow">"kunal@subatomjs.dev"</span><span class="punct">,</span>
  <span class="prop-green">domain</span><span class="punct">:</span> <span class="str-yellow">"[https://kunal.subatomjs.dev](https://kunal.subatomjs.dev)"</span><span class="punct">,</span>
  <span class="prop-green">status</span><span class="punct">:</span> <span class="str-yellow">"Designing resilient cloud-native ecosystems &amp; performant webapps"</span><span class="punct">,</span>
  <span class="prop-green">currentStack</span><span class="punct">: [</span><span class="str-yellow">"TypeScript"</span><span class="punct">,</span> <span class="str-yellow">"Next.js"</span><span class="punct">,</span> <span class="str-yellow">"Node.js"</span><span class="punct">,</span> <span class="str-yellow">"PostgreSQL"</span><span class="punct">,</span> <span class="str-yellow">"Redis"</span><span class="punct">],</span>
  <span class="prop-green">devOpsFocus</span><span class="punct">: [</span><span class="str-yellow">"Docker"</span><span class="punct">,</span> <span class="str-yellow">"Kubernetes"</span><span class="punct">,</span> <span class="str-yellow">"AWS Cloud Infrastructure"</span><span class="punct">]</span>
<span class="punct">};</span></code></pre>
      </div>
    </div>
  </foreignObject>
</svg>
